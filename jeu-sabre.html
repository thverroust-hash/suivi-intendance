<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Sabre &amp; Étoiles — Castlevania-like sabre laser</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;
    background:#05060a;
    color:#cfe3ff;
    font-family:'Courier New',monospace;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #wrap{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:8px;
  }
  #game{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#05060a;
    border:2px solid #1b2740;
    border-radius:6px;
    box-shadow:0 0 40px rgba(60,120,255,.15);
    max-width:100%;
    max-height:78vh;
    touch-action:none;
  }
  .hint{
    font-size:12px; color:#546a94; letter-spacing:1px;
    text-align:center; padding:0 12px;
  }
  /* Commandes tactiles */
  #touch{ display:none; position:fixed; inset:0; pointer-events:none; }
  /* Zone glissante de déplacement (mini-joystick flottant) */
  #pad{
    position:absolute; left:0; bottom:0;
    width:54%; height:48%;
    pointer-events:auto; touch-action:none;
  }
  #pad .padhint{
    position:absolute; left:50%; bottom:34px; transform:translateX(-50%);
    font-family:'Courier New',monospace; font-size:11px; letter-spacing:1px;
    color:rgba(150,180,230,.5); white-space:nowrap; pointer-events:none;
    transition:opacity .2s;
  }
  #stick{
    position:absolute; width:108px; height:108px; margin:-54px 0 0 -54px;
    border-radius:50%; border:2px solid rgba(90,140,220,.4);
    background:radial-gradient(circle,rgba(45,75,130,.28),rgba(20,35,60,.1));
    display:none; pointer-events:none;
  }
  #stick.on{ display:block; }
  #knob{
    position:absolute; left:50%; top:50%; width:50px; height:50px; margin:-25px 0 0 -25px;
    border-radius:50%; background:rgba(80,130,220,.62);
    border:2px solid rgba(160,195,255,.75);
    box-shadow:0 2px 12px rgba(0,0,0,.4);
  }
  /* Boutons d'action (à droite) */
  #actions{
    position:absolute; right:20px; bottom:calc(24px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:12px; align-items:flex-end;
    pointer-events:auto;
  }
  #actions .row{ display:flex; gap:20px; justify-content:flex-end; }
  .btn{
    width:76px; height:76px; border-radius:50%;
    background:rgba(30,45,75,.5);
    border:2px solid rgba(90,140,220,.5);
    color:#dbe8ff; font-size:30px;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(2px);
    box-shadow:0 3px 14px rgba(0,0,0,.35);
    position:relative; touch-action:none;
    transition:transform .05s;
  }
  .btn:active, .btn.on{ background:rgba(70,120,220,.75); transform:scale(.93); }
  .btn.saber{ background:rgba(40,90,60,.55); border-color:rgba(90,230,140,.6); }
  .btn.saber:active,.btn.saber.on{ background:rgba(60,180,100,.85); }
  .btn.sm{ width:56px; height:56px; font-size:22px; }
  .btn.pow{ background:rgba(35,60,110,.55); border-color:rgba(110,180,255,.6); }
  .btn.pow:active,.btn.pow.on{ background:rgba(70,130,230,.85); }
  .btn .sub{
    position:absolute; bottom:8px; font-size:9px; letter-spacing:.5px;
    color:rgba(200,220,255,.7); font-family:'Courier New',monospace;
  }
  /* Bouton son */
  #mute{
    position:fixed; top:10px; right:12px; z-index:5;
    width:36px; height:36px; border-radius:8px;
    background:rgba(20,30,50,.6); border:1px solid rgba(90,140,220,.4);
    color:#dbe8ff; font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; -webkit-user-select:none; user-select:none;
    padding-top:calc(env(safe-area-inset-top));
  }
  #mute:active{ background:rgba(50,80,140,.7); }
  @media (pointer:coarse){ #touch{ display:block; } }
  /* petits écrans : boutons un peu plus compacts */
  @media (pointer:coarse) and (max-width:360px){
    .btn{ width:64px; height:64px; font-size:26px; }
    .btn.sm{ width:48px; height:48px; font-size:19px; }
    #actions .row{ gap:14px; }
  }
</style>
</head>
<body>
<div id="mute" title="Son (M)">🔊</div>
<div id="wrap">
  <canvas id="game" width="320" height="180"></canvas>
  <div class="hint">← → bouger · ESPACE sauter (×2 = roulade) · J frapper (combo ×3, ↓+J = piqué) · K pouvoir · L lame boomerang · M son</div>
</div>

<div id="touch">
  <div id="pad">
    <div class="padhint">◄ glisse le pouce pour te déplacer ►</div>
    <div id="stick"><div id="knob"></div></div>
  </div>
  <div id="actions">
    <div class="row">
      <div class="btn sm pow" data-k="power">⚡</div>
      <div class="btn sm pow" data-k="throw">🌀</div>
    </div>
    <div class="row">
      <div class="btn saber" data-k="attack">⚔</div>
      <div class="btn" data-k="jump">▲<span class="sub">roulade</span></div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const cv  = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.imageSmoothingEnabled = false;

  // ---------- Son (WebAudio, synthétisé) ----------
  const Snd = (() => {
    let ac=null, master=null, musicGain=null, muted=false;
    function ensure(){
      if (ac) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0.22; master.connect(ac.destination);
      musicGain = ac.createGain(); musicGain.gain.value = 0.5; musicGain.connect(master);
    }
    function resume(){ ensure(); if (ac && ac.state==='suspended') ac.resume(); }
    function tone(freq, dur, type, vol, slideTo){
      if (muted || !ac) return;
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = type||'square'; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t+dur);
      g.gain.setValueAtTime(vol||0.3, t);
      g.gain.exponentialRampToValueAtTime(0.001, t+dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
    }
    function noise(dur, vol){
      if (muted || !ac) return;
      const n = Math.floor(ac.sampleRate*dur), buf = ac.createBuffer(1,n,ac.sampleRate), d = buf.getChannelData(0);
      for (let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
      const s = ac.createBufferSource(); s.buffer = buf;
      const g = ac.createGain(); g.gain.value = vol||0.2;
      s.connect(g); g.connect(master); s.start();
    }
    // Note de musique (douce, routée sous les effets)
    function mtone(freq, dur, vol){
      if (muted || !ac) return;
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type='triangle'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+dur+0.02);
    }
    // Progression mineure (La m – Fa – Do – Sol), ambiance épique/sombre
    const CH = [
      { bass:110.00, arp:[440.00,523.25,659.25] },  // Am
      { bass: 87.31, arp:[349.23,440.00,523.25] },  // F
      { bass:130.81, arp:[523.25,659.25,783.99] },  // C
      { bass: 98.00, arp:[392.00,493.88,587.33] }   // G
    ];
    let mFrame=0, mStep=0, tempo=13;
    function tick(){
      if (!ac || muted) return;
      if (++mFrame < tempo) return;
      mFrame = 0;
      const ch = CH[Math.floor(mStep/4) % CH.length];
      mtone(ch.arp[mStep%3], 0.22, 0.5);            // arpège
      if (mStep%4===0) mtone(ch.bass, 0.7, 0.55);   // basse
      if (mStep%8===2) mtone(ch.arp[2]*2, 0.14, 0.22); // accent aigu
      mStep = (mStep+1) % 16;
    }
    return {
      resume, tick, setMuted(m){ muted=m; }, isMuted(){ return muted; },
      swing(){ tone(330,0.12,'sawtooth',0.10,150); },
      hit(){ tone(190,0.10,'square',0.22,80); noise(0.05,0.10); },
      block(){ tone(520,0.12,'square',0.18,940); },
      deflect(){ tone(720,0.14,'sawtooth',0.16,1300); },
      shoot(fast){ tone(fast?920:700,0.09,'square',0.12, fast?220:320); },
      hurt(){ tone(220,0.24,'sawtooth',0.28,70); noise(0.08,0.14); },
      pickup(){ tone(620,0.09,'triangle',0.22,900); setTimeout(()=>tone(980,0.12,'triangle',0.2,1300),70); },
      shard(){ tone(1050,0.06,'triangle',0.14,1500); },
      jump(){ tone(300,0.11,'square',0.12,620); },
      roll(){ noise(0.12,0.12); tone(260,0.12,'sawtooth',0.08,420); },
      burst(){ tone(120,0.3,'sawtooth',0.32,50); noise(0.24,0.22); },
      lamp(){ tone(880,0.07,'square',0.12,300); noise(0.04,0.08); },
      power(){ tone(240,0.22,'sawtooth',0.22,880); noise(0.1,0.1); },
      throwS(){ tone(560,0.16,'sawtooth',0.14,240); },
      uiMove(){ tone(480,0.05,'square',0.08,520); },
      uiSel(){ tone(660,0.08,'triangle',0.16,900); },
      buy(){ tone(520,0.1,'triangle',0.2,780); setTimeout(()=>tone(1040,0.14,'triangle',0.18,1400),80); },
      err(){ tone(150,0.16,'square',0.16,90); },
      win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'triangle',0.22),i*110)); },
      lose(){ [400,300,200].forEach((f,i)=>setTimeout(()=>tone(f,0.26,'sawtooth',0.22,f*0.6),i*150)); }
    };
  })();
  const muteBtn = document.getElementById('mute');
  function toggleMute(){
    Snd.resume(); Snd.setMuted(!Snd.isMuted());
    if (muteBtn) muteBtn.textContent = Snd.isMuted() ? '🔇' : '🔊';
  }
  if (muteBtn){
    muteBtn.addEventListener('click', toggleMute);
    muteBtn.addEventListener('touchend', e => { e.preventDefault(); toggleMute(); }, {passive:false});
  }

  // ---------- Sauvegarde persistante (méta-progression) ----------
  const SAVE_KEY = 'sabre-etoiles-save';
  let save = { crystals:0, upHp:0, upDmg:0, upForce:0, chars:{kael:true}, bestRank:'', bestWave:0, runs:0 };
  try{
    const s = localStorage.getItem(SAVE_KEY);
    if (s){ const d = JSON.parse(s); save = Object.assign(save, d); save.chars = Object.assign({kael:true}, d.chars||{}); }
  }catch(e){}
  function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

  // ---------- Personnages jouables ----------
  const CHARS = {
    kael: { id:'kael', name:'KAEL', cls:'Chevalier Jedi', cost:0,
      hp:5, spd:1, atkScale:1, dmgBonus:0,
      col:{ core:'#4dff8a', hot:'#eafff0', glow:'120,240,160', trail:'130,245,170' },
      body:{ robe:'#6b4a2a', torso:'#8a6238', legs:'#3a2818', hair:'#4a3420' },
      power:{ id:'wave', name:'ONDE DE FORCE', cost:40, desc:'Repousse tout, renvoie les tirs' } },
    vex: { id:'vex', name:'VEX', cls:'Duelliste', cost:150,
      hp:4, spd:1.18, atkScale:0.85, dmgBonus:0,
      col:{ core:'#c77dff', hot:'#f3e6ff', glow:'190,130,255', trail:'200,140,255' },
      body:{ robe:'#3a2f4a', torso:'#54467a', legs:'#241d33', hair:'#20182e' },
      power:{ id:'dash', name:'FRAPPE ÉCLAIR', cost:35, desc:'Ruée tranchante invulnérable' } },
    torr: { id:'torr', name:'TORR', cls:'Gardien', cost:250,
      hp:7, spd:0.85, atkScale:1.1, dmgBonus:1,
      col:{ core:'#ffb84d', hot:'#fff3e0', glow:'255,190,100', trail:'255,200,120' },
      body:{ robe:'#5a3a22', torso:'#8a5a2e', legs:'#33200f', hair:'#9a6a34' },
      power:{ id:'quake', name:'SÉISME', cost:45, desc:'Choc au sol, étourdit tout' } }
  };
  const CHAR_IDS = ['kael','vex','torr'];

  // ---------- Atelier (améliorations permanentes) ----------
  const SHOP = [
    { k:'upHp',    name:'CŒUR RENFORCÉ', costs:[60,120,200],
      desc:['+1 cœur max','+1 cœur max','+1 cœur max'] },
    { k:'upDmg',   name:'LAME AFFÛTÉE',  costs:[60,120,200],
      desc:['Moulinet +1 dégât','Piqué +1 dégât','Toutes frappes +1'] },
    { k:'upForce', name:'FLUX DE FORCE', costs:[50,100,180],
      desc:['+25 énergie max','+25 énergie max','+25 énergie max'] }
  ];

  // ---------- Entrées ----------
  const keys = { left:false, right:false, jump:false, attack:false, down:false, power:false, throw:false };
  const keyMap = {
    ArrowLeft:'left', KeyA:'left', KeyQ:'left',
    ArrowRight:'right', KeyD:'right',
    ArrowUp:'jump', KeyW:'jump', KeyZ:'jump', Space:'jump',
    ArrowDown:'down', KeyS:'down',
    KeyJ:'attack', KeyX:'attack',
    KeyK:'power', KeyC:'power',
    KeyL:'throw', KeyV:'throw'
  };
  addEventListener('keydown', e => {
    if (e.code === 'KeyM'){ toggleMute(); return; }
    if (state.mode !== 'play'){ menuKey(e.code); e.preventDefault(); return; }
    const k = keyMap[e.code];
    if (k){ keys[k] = true; e.preventDefault(); }
  }, {passive:false});
  addEventListener('keyup', e => {
    const k = keyMap[e.code]; if (k){ keys[k] = false; e.preventDefault(); }
  }, {passive:false});

  // Boutons tactiles (actions)
  document.querySelectorAll('#touch .btn').forEach(b => {
    const k = b.dataset.k;
    const on  = e => { e.preventDefault(); keys[k]=true; b.classList.add('on'); };
    const off = e => { e.preventDefault(); keys[k]=false; b.classList.remove('on'); };
    b.addEventListener('touchstart', on,  {passive:false});
    b.addEventListener('touchend',   off, {passive:false});
    b.addEventListener('touchcancel',off, {passive:false});
    b.addEventListener('mousedown',  on);
    b.addEventListener('mouseup',    off);
    b.addEventListener('mouseleave', off);
  });

  // Taps sur le canvas (menus)
  cv.addEventListener('pointerdown', e => {
    const r = cv.getBoundingClientRect();
    const mx = (e.clientX - r.left) * W / r.width;
    const my = (e.clientY - r.top) * H / r.height;
    handleTap(mx, my);
  });

  // Zone tactile glissante : mini-joystick flottant pour gauche/droite (+ bas = piqué)
  const pad = document.getElementById('pad');
  const stick = document.getElementById('stick');
  const knob = document.getElementById('knob');
  const padHint = pad.querySelector('.padhint');
  let padId = null, padOX = 0, padOY = 0;
  const DEAD = 7, KNOB_MAX = 40, DOWN_DEAD = 24;

  function padStart(e){
    if (padId !== null) return;
    const t = e.changedTouches ? e.changedTouches[0] : e;
    padId = e.changedTouches ? t.identifier : 'mouse';
    padOX = t.clientX; padOY = t.clientY;
    const r = pad.getBoundingClientRect();
    stick.style.left = (t.clientX - r.left) + 'px';
    stick.style.top  = (t.clientY - r.top) + 'px';
    stick.classList.add('on');
    knob.style.transform = 'translate(0,0)';
    if (padHint) padHint.style.opacity = '0';
    e.preventDefault();
  }
  function padMove(e){
    if (padId === null) return;
    let t = e;
    if (e.changedTouches){
      t = [...e.changedTouches].find(x => x.identifier === padId);
      if (!t) return;
    }
    let dx = t.clientX - padOX;
    // l'origine suit le pouce au-delà du rayon max → inversion quasi immédiate
    if (dx >  KNOB_MAX){ padOX = t.clientX - KNOB_MAX; dx =  KNOB_MAX; }
    else if (dx < -KNOB_MAX){ padOX = t.clientX + KNOB_MAX; dx = -KNOB_MAX; }
    keys.left  = dx < -DEAD;
    keys.right = dx >  DEAD;
    const dy = t.clientY - padOY;
    keys.down = dy > DOWN_DEAD;   // pouce vers le bas → piqué
    const ky = Math.max(0, Math.min(KNOB_MAX, dy));
    knob.style.transform = 'translate(' + dx + 'px,' + ky + 'px)';
    e.preventDefault();
  }
  function padEnd(e){
    if (padId === null) return;
    if (e.changedTouches && ![...e.changedTouches].some(x => x.identifier === padId)) return;
    padId = null;
    keys.left = false; keys.right = false; keys.down = false;
    stick.classList.remove('on');
    if (padHint) padHint.style.opacity = '';
    if (e.cancelable) e.preventDefault();
  }
  pad.addEventListener('touchstart', padStart, {passive:false});
  pad.addEventListener('touchmove',  padMove,  {passive:false});
  pad.addEventListener('touchend',   padEnd,   {passive:false});
  pad.addEventListener('touchcancel',padEnd,   {passive:false});
  pad.addEventListener('mousedown',  padStart);
  window.addEventListener('mousemove', padMove);
  window.addEventListener('mouseup',   padEnd);

  // ---------- Constantes physique ----------
  const GRAV = 0.5, MOVE = 1.4, FRICTION = 0.78, JUMP = 8.2;
  const GROUND = H - 24;

  // ---------- Niveaux (définis dynamiquement, voir LEVELS) ----------
  let LEVEL_W, GOAL_X, platforms, theme;

  // ---------- État ----------
  const state = { mode:'title', time:0, cam:0, shake:0, hitstop:0,
                  level:1, runTime:0, rank:'', arena:false, wave:0 };
  const menu = { char:'kael', sel:0 };
  let player, troopers, bolts, sparks, saberTrail, pickups, rings, thrown, props, msg, msgT;
  let killCount = 0, runCrystals = 0, waveT = 0;
  let uiZones = [];

  // Paramètres du sabre
  const ATTACK_CD = 10;
  const SABER_LEN = 22, SABER_REST = -1.15;
  // Enchaînement au sol : chaque coup alterne le sens du geste (a0 → a1)
  const COMBO = [
    { a0:-2.30, a1: 0.85, dur:14, len:22, tw:1.0 },             // fendant piqué (haut → bas)
    { a0: 1.35, a1:-1.75, dur:13, len:23, tw:1.15 },            // revers remontant (bas → haut)
    { a0:-2.60, a1: 2.90, dur:22, len:29, tw:1.8, power:true }  // moulinet (rotation complète)
  ];
  const COMBO_WINDOW = 16;   // frames pour enchaîner après un geste
  const DIVE_DUR = 22;       // durée du coup plongeant
  // Roulade (double saut esquive)
  const ROLL_DUR = 16, ROLL_SPEED = 4.8, ROLL_JUMP = 5.2;
  // Ennemis
  const DETECT = 150;        // distance de détection
  const AIM_TIME = 24;       // temps de visée télégraphié avant le tir (~0,4 s)
  const BOLT_SPEED = 2.4;
  // Bonus temporaires
  const FURY_TIME = 360;     // durée du mode Fureur (~6 s)
  // Force
  const THROW_COST = 15;     // coût de la lame boomerang

  // ---------- Fabrique d'ennemis ----------
  function addTrooper(x, dir, hp){
    troopers.push({ type:'trooper', x, y:GROUND-22, w:12, h:22, dir,
      hp:hp||2, alive:true, hit:0, hitLock:false, stun:0, aim:0,
      shootCd:60+Math.random()*60, shootGap:70+Math.random()*70,
      prefDist:58+Math.random()*45, spd:0.3+Math.random()*0.35 });
  }
  function addDroid(x,y){
    troopers.push({ type:'droid', x, y, baseY:y, w:14, h:11, dir:-1,
      hp:2, alive:true, hit:0, hitLock:false, stun:0, aim:0,
      shootCd:70+Math.random()*80, phase:Math.random()*6.28 });
  }
  function addAcolyte(x){
    troopers.push({ type:'acolyte', x, y:GROUND-20, w:11, h:20, dir:-1,
      hp:3, alive:true, hit:0, hitLock:false, stun:0,
      st:'patrol', stT:0, lungeCd:0 });
  }
  function addBoss(x, hp, tier){
    troopers.push({ type:'boss', x, y:GROUND-30, w:18, h:30, dir:-1, tier:tier||1,
      hp, maxhp:hp, alive:true, hit:0, hitLock:false, stun:0,
      state:'approach', stateT:70, atkCd:70, swingT:0, iframe:0, rage:0 });
  }
  function addPickup(x,y,type,grounded){
    pickups.push({ x, y, type, w:10, h:10, vx:0, vy:0, grounded:!!grounded, phase:Math.random()*6.28, dead:false });
  }
  function addShard(x,y){
    pickups.push({ x, y, type:'shard', w:6, h:6,
      vx:(Math.random()-0.5)*2, vy:-1-Math.random()*1.5,
      grounded:false, phase:Math.random()*6.28, dead:false });
  }
  // Pylônes lumineux destructibles (les « chandeliers » du jeu)
  function addProp(x){
    props.push({ x, y:GROUND-15, w:6, h:15, alive:true, ph:Math.random()*6.28 });
  }
  function breakProp(pr){
    pr.alive = false;
    spark(pr.x+3, pr.y+4, '#ffe873', 10);
    Snd.lamp();
    const r = Math.random();
    if (r<0.5) addShard(pr.x, pr.y);
    else if (r<0.75){ addShard(pr.x-2, pr.y); addShard(pr.x+3, pr.y); }
    else if (r<0.85) addPickup(pr.x-2, pr.y, 'heal');
    else if (r<0.92) addPickup(pr.x-2, pr.y, 'fury');
    else addShard(pr.x, pr.y);
  }

  // ---------- Définition des niveaux ----------

  function spawnWave(n){
    theme = LEVELS[(n-1)%LEVELS.length].theme;   // le décor change à chaque vague
    troopers = []; bolts = [];
    props = props.filter(pr => pr.alive);
    const rx = () => {
      for (let tries=0; tries<20; tries++){
        const x = 40 + Math.random()*(LEVEL_W-100);
        if (Math.abs(x - player.x) > 70) return x;
      }
      return 60;
    };
    const thp = 2 + Math.floor(n/4);
    const tc = Math.min(2 + Math.floor(n*0.8), 8);
    for (let i=0;i<tc;i++) addTrooper(rx(), Math.random()<0.5?-1:1, thp);
    if (n>=2){ const dc = Math.min(1+Math.floor((n-2)/2), 4); for (let i=0;i<dc;i++) addDroid(rx(), 50+Math.random()*30); }
    if (n>=3){ const ac = Math.min(Math.floor((n-1)/2), 4); for (let i=0;i<ac;i++) addAcolyte(rx()); }
    if (n%5===0) addBoss(rx(), 10+3*n, Math.min(3, Math.ceil(n/5)));
    addProp(rx()); addProp(rx());
    for (const t of troopers) spark(t.x+t.w/2, t.y+t.h/2, '#8fa4cc', 6);

  function banner(t){ msg = t; msgT = 90; }

  // ---------- Combat ----------
  function boltSpawn(x,y,vx,vy,from){
    bolts.push({x,y,vx,vy,from,r:2,life:180});
  }
  function spark(x,y,color,n=6){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, s=0.5+Math.random()*2;
      sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:12+Math.random()*10,color});
    }
  }
  function ring(x,y,max,col){ rings.push({x,y,r:6,max,col}); }
  function overlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }
  function pointInRect(px,py,r){
    return px>=r.x && px<=r.x+r.w && py>=r.y && py<=r.y+r.h;
  }

  // Angle de la lame selon le coup en cours (combo au sol ou piqué en l'air)
  function saberAngle(){
    const p = player;
    if (p.attack<=0) return SABER_REST;
    if (p.diving) return Math.PI/2;            // pointe vers le bas
    const step = COMBO[p.combo] || COMBO[0];
    const t = 1 - p.attack/p.attackDur;        // 0 → 1 le long du geste
    const e = t*t*(3-2*t);                      // lissage (smoothstep)
    return step.a0 + e*(step.a1-step.a0);
  }
  // Segment de lame en coordonnées monde
  function saberSeg(){
    const p = player;
    if (p.diving){                              // lame verticale, centrée
      const gx = p.x+p.w/2, gy = p.y+12, len = SABER_LEN+4;
      return { gx, gy, tx:gx, ty:gy+len };
    }
    const gx = p.face>0 ? p.x+p.w : p.x;
    const gy = p.y+10;
    const a = saberAngle(), d = p.face;
    let len = (p.attack>0 && !p.diving && COMBO[p.combo]) ? COMBO[p.combo].len : SABER_LEN;
    if (p.fury>0) len += 6;   // lame allongée en Fureur
    return { gx, gy, tx: gx+Math.cos(a)*len*d, ty: gy+Math.sin(a)*len };
  }
  // Fenêtre active : tout le piqué, ou le milieu du geste au sol
  function saberActive(){
    const p = player;
    if (p.diving) return p.attack>0;
    return p.attack>2 && p.attack < p.attackDur-2;
  }
  // Points échantillonnés le long de la lame (pour la détection sur tout l'arc)
  function bladePts(seg){
    const pts=[];
    for(let i=0.35;i<=1.001;i+=0.16)
      pts.push({x:seg.gx+(seg.tx-seg.gx)*i, y:seg.gy+(seg.ty-seg.gy)*i});
    return pts;
  }
  function nearestTrooper(x,y){
    let best=null, bd=1e9;
    for(const t of troopers){ if(!t.alive) continue;
      const dx=t.x+t.w/2-x, dy=t.y+t.h/2-y, d=dx*dx+dy*dy;
      if(d<bd){ bd=d; best=t; } }
    return best;
  }
  function deflectBolt(b){
    b.from='player';
    const sp = 3.8, tg = nearestTrooper(b.x,b.y);
    if (tg){
      const ddx=tg.x+tg.w/2-b.x, ddy=tg.y+tg.h/2-b.y, m=Math.hypot(ddx,ddy)||1;
      b.vx = ddx/m*sp; b.vy = ddy/m*sp;
    } else { b.vx = sp*player.face; b.vy = (Math.random()-0.5)*1.2; }
  }
  function kick(m){ state.shake = Math.min(6, Math.max(state.shake, m)); }
  function bossAlive(){ return troopers.some(t => t.type==='boss' && t.alive); }

  // ---------- IA des ennemis ----------
  function aiTrooper(t){
    const dx = player.x - t.x, adx = Math.abs(dx);
    if (adx < DETECT){
      t.dir = Math.sign(dx) || t.dir;
      if (t.aim>0){
        if (--t.aim === 0){
          const bx = t.x + (t.dir>0 ? t.w : 0);
          boltSpawn(bx, t.y+8, BOLT_SPEED*t.dir, 0, 'trooper');
          spark(bx, t.y+8, '#ff4d4d', 4); Snd.shoot(false);
          t.shootCd = t.shootGap;
        }
      } else {
        if (adx < t.prefDist-12)      t.x -= t.spd*Math.sign(dx);   // recule si trop près
        else if (adx > t.prefDist+12) t.x += t.spd*Math.sign(dx);   // avance si trop loin
        if (--t.shootCd<=0 && adx>40) t.aim = AIM_TIME;             // pas de tir collé
      }
    } else {
      t.x += 0.4*t.dir;
    }
    if (t.x<20){ t.x=20; t.dir=1; }
    if (t.x>LEVEL_W-32){ t.x=LEVEL_W-32; t.dir=-1; }
  }

  function aiDroid(t){
    t.phase += 0.05;
    t.y = t.baseY + Math.sin(t.phase)*10;   // vol sinusoïdal
    const dx = player.x - t.x, adx = Math.abs(dx);
    t.dir = Math.sign(dx) || t.dir;
    if (adx < DETECT+40){
      const want = 88;
      if (adx < want-10) t.x -= 0.55*Math.sign(dx);
      else if (adx > want+10) t.x += 0.65*Math.sign(dx);
      if (t.aim>0){
        if (--t.aim === 0){
          const bx = t.x+t.w/2, by = t.y+t.h;
          const ddx = player.x+player.w/2-bx, ddy = player.y+8-by, m = Math.hypot(ddx,ddy)||1;
          boltSpawn(bx, by, ddx/m*2.6, ddy/m*2.6, 'trooper');   // tir en piqué visé
          spark(bx, by, '#ff4d4d', 4); Snd.shoot(false);
          t.shootCd = 100+Math.random()*70;
        }
      } else if (--t.shootCd<=0){ t.aim = AIM_TIME; }
    }
    if (t.x<20) t.x=20;
    if (t.x>LEVEL_W-32) t.x=LEVEL_W-32;
  }

  function aiAcolyte(t){
    const dx = player.x - t.x, adx = Math.abs(dx);
    if (t.lungeCd>0) t.lungeCd--;
    switch(t.st){
      case 'patrol':
        t.x += 0.5*t.dir;
        if (adx < 170) t.st='chase';
        break;
      case 'chase':
        t.dir = Math.sign(dx) || t.dir;
        t.x += 1.25*t.dir;
        if (adx < 26 && t.lungeCd<=0){ t.st='wind'; t.stT=14; }
        if (adx > 220) t.st='patrol';
        break;
      case 'wind':   // amorce télégraphiée de la ruée
        if (--t.stT<=0){ t.st='lunge'; t.stT=10; }
        break;
      case 'lunge':
        t.x += 3.4*t.dir;
        if (--t.stT<=0){ t.st='rec'; t.stT=18; t.lungeCd=55; }
        break;
      case 'rec':
        if (--t.stT<=0) t.st='chase';
        break;
    }
    if (t.x<20){ t.x=20; t.dir=1; }
    if (t.x>LEVEL_W-32){ t.x=LEVEL_W-32; t.dir=-1; }
  }

  function fireVolley(t){
    const bx = t.x + (t.dir>0 ? t.w : 0), by = t.y+12;
    const base = Math.atan2(player.y+8-by, player.x+player.w/2-bx);
    const n = 2 + t.tier + (t.enraged?1:0);        // 3 / 4 / 5 (+1 enragé) tirs
    const sp = 3.5 + 0.25*t.tier + (t.enraged?0.4:0);
    for (let i=0;i<n;i++){
      const a = base + (i-(n-1)/2)*0.22;
      boltSpawn(bx, by, Math.cos(a)*sp, Math.sin(a)*sp, 'trooper');
    }
    spark(bx, by, '#ff5a4d', 7); Snd.shoot(true);
  }
  function bossBurst(t){
    t.state='burst'; t.stateT=22; t.atkCd=Math.max(t.atkCd,45);
    spark(t.x+t.w/2, t.y+t.h/2, '#ffcaa0', 22); kick(6);
    ring(t.x+t.w/2, t.y+t.h/2, 50, '#ffcaa0');
    state.hitstop = Math.max(state.hitstop, 4);
    Snd.burst();
    const dx = player.x - t.x, dy = player.y - t.y;
    if (Math.hypot(dx,dy) < 52){        // repousse fortement le joueur trop près
      if (player.invuln<=0) hurt(1);
      player.vx = 6.2*Math.sign(dx||1); player.vy = -5.2;
      player.diving = false;
    }
  }
  function aiBoss(t){
    const dx = player.x - t.x, adx = Math.abs(dx);
    t.dir = Math.sign(dx) || t.dir;
    if (t.iframe>0) t.iframe--;
    if (t.stateT>0) t.stateT--;
    if (t.atkCd>0) t.atkCd--;
    const spd = (0.95 + 0.2*t.tier) * (t.enraged ? 1.35 : 1);
    switch(t.state){
      case 'approach':
        if (adx>28) t.x += spd*Math.sign(dx);      // avance vite et sans relâche
        // enragé : peut se téléporter dans le dos du joueur
        if (t.enraged && t.atkCd<=0 && adx>60 && adx<230 && Math.random()<0.04){
          t.state='tpout'; t.stateT=16; t.iframe=Math.max(t.iframe,30);
          spark(t.x+t.w/2, t.y+t.h/2, '#c77dff', 10); Snd.throwS();
          break;
        }
        if (t.atkCd<=0){
          if (adx < 48){ t.state='wind'; t.stateT=16; }             // corps à corps
          else if (adx < 220){ t.state='volwind'; t.stateT=24; }    // volée à distance
        } else if (t.stateT<=0 && Math.random()<0.35){
          t.state='guard'; t.stateT=45+Math.random()*30;
        }
        break;
      case 'tpout':   // disparition télégraphiée…
        if (t.stateT<=0){
          const bx = player.x + (player.face>0 ? -34 : 34);   // …et surgit dans ton dos
          t.x = Math.max(24, Math.min(LEVEL_W-40, bx));
          spark(t.x+t.w/2, t.y+t.h/2, '#c77dff', 14);
          t.state='tpin'; t.stateT=8;
        }
        break;
      case 'tpin':
        if (t.stateT<=0){ t.state='wind'; t.stateT=10; }
        break;
      case 'wind':
        if (t.stateT<=0){ t.state='attack'; t.stateT=12; t.swingT=12; t.atkCd=60+Math.random()*30; }
        break;
      case 'attack':
        if (t.swingT>0) t.swingT--;
        if (t.stateT<=0) t.state='approach';
        break;
      case 'volwind':
        if (t.stateT<=0){ fireVolley(t); t.state='volley'; t.stateT=10; t.atkCd=70+Math.random()*40; }
        break;
      case 'volley':
        if (t.stateT<=0) t.state='approach';
        break;
      case 'guard':
        if (t.stateT<=0){ t.state='approach'; t.atkCd=Math.min(t.atkCd,20); }
        break;
      case 'burst':
        if (t.stateT<=0) t.state='approach';
        break;
    }
    if (t.x<20) t.x=20;
    if (t.x>LEVEL_W-24) t.x=LEVEL_W-24;
    // dégâts de la frappe du boss
    if (t.state==='attack' && t.swingT>5 && player.invuln<=0){
      const box = t.dir>0 ? {x:t.x+t.w, y:t.y+2, w:24, h:t.h} : {x:t.x-24, y:t.y+2, w:24, h:t.h};
      if (overlap(player, box)){ hurt(1); player.vx = 5.2*t.dir; player.vy = -3; }
    }
  }

  // Dégâts à un ennemi (le boss a de brèves i-frames + une riposte anti-camping)
  function damageEnemy(t, dmg){
    if (t.type==='boss'){
      if (t.iframe>0) return false;
      t.hp -= dmg; t.hit=8; t.iframe=12;
      // Phase 2 du boss final : rage sombre sous 50 % de vie
      if (!t.enraged && t.tier>=3 && t.hp>0 && t.hp<=t.maxhp/2){
        t.enraged = true; t.iframe = 30; t.rage = 0;
        banner('LE GARDE LIBÈRE SA COLÈRE !');
        ring(t.x+t.w/2, t.y+t.h/2, 60, '#c77dff');
        kick(6); Snd.power();
        t.state='approach'; t.stateT=0; t.atkCd=20;
        return true;
      }
      t.rage = (t.rage||0)+1;
      if (t.hp>0 && t.rage>=3){ t.rage=0; bossBurst(t); }
    } else {
      t.hp -= dmg; t.hit=8;
    }
    if (t.hp<=0) onEnemyDeath(t);
    return true;
  }

  // Mort d'un ennemi : butin, cristaux, énergie
  function dropLoot(t){
    const r = Math.random();
    if (r < 0.18) addPickup(t.x+t.w/2-5, t.y, 'heal');
    else if (r < 0.27) addPickup(t.x+t.w/2-5, t.y, 'fury');
  }
  function onEnemyDeath(t){
    t.alive = false;
    killCount++;
    player.energy = Math.min(player.energyMax, player.energy+10);
    const shards = t.type==='boss' ? 5 : t.type==='trooper' ? 1 : 2;
    for (let i=0;i<shards;i++) addShard(t.x+t.w/2-3, t.y+4);
    if (t.type==='boss'){
      spark(t.x+t.w/2, t.y+t.h/2, '#ffffff', 30); kick(7);
      state.hitstop = Math.max(state.hitstop, 10);
      banner('GARDE VAINCU — LA VOIE EST LIBRE');
      addPickup(t.x+t.w/2-5, t.y, 'heal');
    } else {
      spark(t.x+t.w/2, t.y+t.h/2, '#ffffff', 16); kick(5);
      state.hitstop = Math.max(state.hitstop, 6);
      dropLoot(t);
    }
  }
  function applyPickup(k){
    if (k.type==='heal'){
      if (player.hp<player.maxhp){ player.hp++; banner('SOIN +1'); }
      else banner('PLEINE VIE');
      spark(player.x+player.w/2, player.y+8, '#7dff9a', 12);
      Snd.pickup();
    } else if (k.type==='fury'){
      player.fury = FURY_TIME; banner('FUREUR DU SABRE !');
      spark(player.x+player.w/2, player.y+8, '#5cc8ff', 16);
      kick(3); Snd.pickup();
    } else { // cristal
      runCrystals += 5;
      spark(k.x+3, k.y+3, '#ffd24d', 4);
      Snd.shard();
    }
  }

  function updatePickups(){
    const p = player;
    for (const k of pickups){
      // aimant des cristaux vers le héros
      if (k.type==='shard'){
        const dx = p.x+p.w/2-(k.x+k.w/2), dy = p.y+p.h/2-(k.y+k.h/2), m = Math.hypot(dx,dy);
        if (m < 52){ k.x += dx/m*2.8; k.y += dy/m*2.8; k.grounded = true; }
      }
      if (!k.grounded){
        k.vy += 0.35; k.x += k.vx||0; k.y += k.vy;
        for (const pl of platforms){
          if (k.x+k.w>pl.x && k.x<pl.x+pl.w &&
              k.y+k.h>pl.y && k.y+k.h < pl.y+pl.h+12 && k.vy>=0){
            k.y = pl.y-k.h; k.vy=0; k.vx=0; k.grounded=true;
          }
        }
        if (k.y>H+30) k.dead=true;
      }
      k.phase += 0.12;
      if (overlap(p, {x:k.x-4, y:k.y-4, w:k.w+8, h:k.h+8})){ applyPickup(k); k.dead=true; }
    }
    pickups = pickups.filter(k=>!k.dead);
  }

  // ---------- Pouvoirs de Force ----------
  function usePower(){
    const p = player, pw = p.charDef.power;
    if (p.energy < pw.cost){ Snd.err(); return; }
    if (pw.id==='quake' && !p.onGround){ Snd.err(); return; }
    p.energy -= pw.cost;
    const cx = p.x+p.w/2, cy = p.y+p.h/2;
    if (pw.id==='wave'){
      // Onde de Force : renvoie les tirs proches, repousse et étourdit les ennemis
      ring(cx, cy, 68, '#7de8ff');
      kick(4); Snd.power();
      for (const b of bolts){
        if (b.from==='trooper' && Math.hypot(b.x-cx, b.y-cy) < 72){
          deflectBolt(b); spark(b.x,b.y,'#bff7ff',6);
        }
      }
      for (const t of troopers){
        if (t.alive && t.type!=='boss' && Math.hypot(t.x+t.w/2-cx, t.y+t.h/2-cy) < 72){
          t.stun = Math.max(t.stun, 42);
          t.x += (t.x < p.x ? -12 : 12);
          spark(t.x+t.w/2, t.y+t.h/2, '#7de8ff', 6);
        }
      }
    } else if (pw.id==='dash'){
      // Frappe éclair : ruée invulnérable qui tranche tout sur son passage
      p.dashT = 9;
      p.invuln = Math.max(p.invuln, 16);
      p.rolling = 0; p.diving = false;
      for (const t of troopers) t.dashLock = false;
      spark(cx, cy, p.col.core, 8);
      kick(3); Snd.power();
    } else {
      // Séisme : onde de choc au sol, dégâts + étourdissement
      ring(cx, p.y+p.h, 84, '#ffcf8a');
      kick(6); state.hitstop = Math.max(state.hitstop, 4);
      Snd.burst();
      const dmg = 2 + p.charDef.dmgBonus + (save.upDmg>=3?1:0);
      for (const t of troopers){
        if (!t.alive || t.type==='droid') continue;
        if (Math.abs(t.x+t.w/2-cx) < 95){
          damageEnemy(t, dmg);
          if (t.alive && t.type!=='boss') t.stun = Math.max(t.stun, 48);
          spark(t.x+t.w/2, t.y+t.h/2, '#ffcf8a', 8);
        }
      }
    }
  }

  function throwSaber(){
    const p = player;
    if (thrown || p.energy < THROW_COST){ Snd.err(); return; }
    p.energy -= THROW_COST;
    thrown = { x:p.x+p.w/2, y:p.y+8, vx:4.2*p.face, dist:0, phase:'out', spin:0 };
    troopers.forEach(t => t.thLock = false);
    Snd.throwS();
  }
  function updateThrown(){
    const p = player, s = thrown;
    if (!s) return;
    s.spin += 0.45;
    if (s.phase==='out'){
      s.x += s.vx; s.dist += Math.abs(s.vx);
      if (s.dist > 95){ s.phase='back'; troopers.forEach(t => t.thLock=false); }
    } else {
      const dx = p.x+p.w/2-s.x, dy = p.y+8-s.y, m = Math.hypot(dx,dy)||1;
      s.x += dx/m*5.2; s.y += dy/m*5.2;
      if (m < 11){ thrown = null; return; }
    }
    // touche les ennemis (une fois à l'aller, une fois au retour)
    for (const t of troopers){
      if (t.alive && !t.thLock &&
          s.x>t.x-2 && s.x<t.x+t.w+2 && s.y>t.y-2 && s.y<t.y+t.h+2){
        t.thLock = true;
        const d = 1 + (p.fury>0?1:0);
        if (damageEnemy(t, d)){ spark(t.x+6, t.y+10, p.col.core, 8); Snd.hit(); }
      }
    }
    // la lame lancée dévie aussi les tirs qu'elle croise
    for (const b of bolts){
      if (b.from==='trooper' && Math.hypot(b.x-s.x, b.y-s.y) < 8){
        deflectBolt(b); spark(b.x,b.y,'#bff7ff',5); Snd.deflect();
      }
    }
    // et brise les pylônes sur son passage
    for (const pr of props){
      if (pr.alive && Math.abs(s.x-(pr.x+3))<8 && Math.abs(s.y-(pr.y+7))<12) breakProp(pr);
    }
  }

  function hurt(n){
    const p=player;
    p.hp-=n; p.invuln=60;
    spark(p.x+p.w/2, p.y+8, '#ff6b6b', 8);
    kick(3); Snd.hurt();
    if (p.hp<=0) p.hp=0;
  }

  // ---------- Boucle de jeu ----------
  function update(){
    const p = player;

    // Déplacement
    if (p.rolling>0){
      // pendant la roulade : l'élan est conservé, le contrôle est réduit
      p.vx *= 0.94;
    } else if (p.dashT>0){
      p.vx = 8.5*p.face;   // ruée éclair
    } else {
      // demi-tour net : on tue l'élan opposé pour une réponse immédiate
      if (keys.left){ if (p.vx>0) p.vx*=0.5; p.vx -= MOVE*p.spd; p.face=-1; }
      if (keys.right){ if (p.vx<0) p.vx*=0.5; p.vx += MOVE*p.spd; p.face=1; }
      p.vx *= FRICTION;
      const cap = 3*p.spd;
      if (Math.abs(p.vx) > cap) p.vx = cap*Math.sign(p.vx);
    }

    // Saut, et double saut en roulade (esquive)
    const jumpEdge = keys.jump && !p.prevJump;
    p.prevJump = keys.jump;
    if (p.onGround) p.airUsed = false;
    if (jumpEdge){
      if (p.onGround){ p.vy = -JUMP; p.onGround=false; Snd.jump(); }
      else if (!p.airUsed && !p.diving){
        p.airUsed = true; p.rolling = ROLL_DUR;
        const dir = keys.left ? -1 : keys.right ? 1 : p.face;
        p.face = dir;
        p.vx = ROLL_SPEED*dir; p.vy = -ROLL_JUMP;
        p.invuln = Math.max(p.invuln, ROLL_DUR+4);   // i-frames d'esquive
        spark(p.x+p.w/2, p.y+p.h, '#bcd4ff', 8); Snd.roll();
      }
    }
    if (p.rolling>0) p.rolling--;
    p.vy += GRAV; if (p.vy>10) p.vy=10;

    p.x += p.vx;
    if (p.x<0) p.x=0;
    if (p.x+p.w>LEVEL_W) p.x=LEVEL_W-p.w;

    p.y += p.vy;
    p.onGround=false;
    for (const pl of platforms){
      if (p.x+p.w>pl.x && p.x<pl.x+pl.w){
        if (p.vy>=0 && p.y+p.h>pl.y && p.y+p.h < pl.y+pl.h+14 &&
            p.y+p.h-p.vy <= pl.y+1){
          p.y = pl.y-p.h; p.vy=0; p.onGround=true;
        }
      }
    }

    // Énergie de Force (régénération lente)
    p.energy = Math.min(p.energyMax, p.energy + 0.06 + save.upForce*0.02);

    // Pouvoir et lame boomerang (front montant)
    const powEdge = keys.power && !p.prevPow; p.prevPow = keys.power;
    const thrEdge = keys.throw && !p.prevThr; p.prevThr = keys.throw;
    if (powEdge) usePower();
    if (thrEdge) throwSaber();
    updateThrown();

    // Ruée de Vex : tranche ce qu'elle traverse
    if (p.dashT>0){
      p.dashT--;
      spark(p.x+Math.random()*p.w, p.y+Math.random()*p.h, p.col.core, 1);
      const dmg = 2 + p.charDef.dmgBonus + (save.upDmg>=3?1:0);
      for (const t of troopers){
        if (t.alive && !t.dashLock && overlap(p,t)){
          t.dashLock = true;
          if (damageEnemy(t, dmg)){ spark(t.x+t.w/2, t.y+t.h/2, p.col.core, 10); Snd.hit(); }
        }
      }
    }

    // ---- Attaque au sabre : combo au sol/en l'air, piqué avec Bas ----
    const atkEdge = keys.attack && !p.prevAtk;   // front montant (une frappe par appui)
    p.prevAtk = keys.attack;

    if (p.attackCd>0) p.attackCd--;
    // atterrissage pendant un piqué : onde de choc
    if (p.diving && p.onGround){
      p.diving=false; p.attack=0; p.attackCd=8;
      kick(4); state.hitstop = Math.max(state.hitstop,3);
      spark(p.x+p.w/2, p.y+p.h, '#bff7ff', 12);
    }
    if (p.attack>0){
      p.attack--;
      if (p.attack===0){
        if (p.diving){ p.diving=false; p.attackCd = Math.max(p.attackCd,6); } // piqué manqué
        else p.comboWindow = COMBO_WINDOW;     // fenêtre d'enchaînement
      }
    }
    if (p.comboWindow>0){ p.comboWindow--; if (p.comboWindow===0) p.combo=0; }
    if (p.comboShow>0) p.comboShow--;

    if (atkEdge && p.attack<=0 && p.attackCd<=0){
      if (!p.onGround && keys.down && !p.diving){
        // coup plongeant : attaque « bas » en l'air
        p.diving=true; p.attack=DIVE_DUR; p.attackDur=DIVE_DUR;
        p.combo=0; p.comboWindow=0; p.rolling=0;
        p.vy = Math.max(p.vy, 5.5); p.vx *= 0.4;
        Snd.swing();
      } else {
        // frappe : combo au sol OU slash aérien (touche les droïdes)
        if (p.comboWindow>0 && p.combo<COMBO.length-1) p.combo++; else p.combo=0;
        const step = COMBO[p.combo];
        const dur = Math.max(8, Math.round(step.dur*p.charDef.atkScale));
        p.attack = dur; p.attackDur = dur;
        p.attackCd = dur + (step.power ? ATTACK_CD+6 : 4);
        p.comboWindow = 0;
        if (step.power && p.onGround) p.vx += p.face*1.8;   // élan avant sur le moulinet
        if (p.combo>0) p.comboShow = 40;
        Snd.swing();
      }
    }
    if (p.invuln>0) p.invuln--;

    const seg = saberSeg();
    const active = p.attack>0 && saberActive();
    const bpts = active ? bladePts(seg) : null;

    // Traînée lumineuse : on enregistre la position de la lame pendant le geste
    if (p.attack>0){
      const tw = (!p.diving && COMBO[p.combo]) ? COMBO[p.combo].tw : 1;
      saberTrail.push({ gx:seg.gx, gy:seg.gy, tx:seg.tx, ty:seg.ty, life:9, tw });
    }
    for (const tr of saberTrail) tr.life--;
    saberTrail = saberTrail.filter(tr=>tr.life>0);

    // Ennemis
    const fury = p.fury>0;
    for (const t of troopers){
      if (!t.alive){ continue; }
      if (t.hit>0) t.hit--;
      if (!active) t.hitLock = false;      // ré-armé entre deux gestes

      // étourdi : figé, sans IA ni danger de contact
      if (t.stun>0){ t.stun--; }
      else {
        if (t.type==='droid')        aiDroid(t);
        else if (t.type==='boss')    aiBoss(t);
        else if (t.type==='acolyte') aiAcolyte(t);
        else                          aiTrooper(t);
      }

      // frappé par le sabre : lame testée sur tout l'arc, un impact par geste
      if (active && !t.hitLock &&
          bpts.some(pt=>pointInRect(pt.x,pt.y,{x:t.x,y:t.y,w:t.w,h:t.h}))){
        t.hitLock = true;
        // Le boss en garde bloque les coups au sol (mais pas le piqué aérien)
        const guarding = t.type==='boss' && t.state==='guard' && !p.diving;
        if (guarding){
          t.hit = 4;
          spark(t.x + (t.dir>0?t.w:0), t.y+10, '#ffd24d', 8);
          kick(2); p.vx += 2.2*p.face;   // rebond : le coup est paré
          Snd.block();
        } else if (p.diving){
          // piqué : rebond façon pogo + gros dégâts
          const dmg = 2 + (fury?1:0) + p.charDef.dmgBonus
                    + (save.upDmg>=2?1:0) + (save.upDmg>=3?1:0);
          const dealt = damageEnemy(t, dmg);
          p.vy = -JUMP*0.72; p.diving=false; p.attack=0; p.attackCd=4;
          spark(t.x+t.w/2, t.y, '#bff7ff', 12);
          kick(4); state.hitstop = Math.max(state.hitstop,4);
          if (dealt) Snd.hit();
        } else {
          const power = COMBO[p.combo] && COMBO[p.combo].power;
          const dmg = (power?2:1) + (fury?1:0) + p.charDef.dmgBonus
                    + ((power && save.upDmg>=1)?1:0) + (save.upDmg>=3?1:0);
          const dealt = damageEnemy(t, dmg);
          p.vx += (power ? -3 : -1.6)*p.face;
          kick(power ? 5 : 3);
          state.hitstop = Math.max(state.hitstop, power ? 5 : 3);
          spark(t.x+t.w/2, t.y+t.h/2, fury?'#5cc8ff':'#8fe3ff', power ? 14 : 10);
          if (dealt) Snd.hit();
        }
      }
      // contact direct : dégâts (sauf piqué, roulade, ou ennemi étourdi)
      if (t.alive && t.stun<=0 && !p.diving && p.rolling<=0 && p.invuln<=0 && overlap(p,t)){
        hurt(1); p.vx = 4*Math.sign(p.x-t.x || 1);
      }
    }

    // Pylônes destructibles : sabre, piqué ou ruée les brisent
    for (const pr of props){
      if (!pr.alive) continue;
      const box = {x:pr.x, y:pr.y, w:pr.w, h:pr.h};
      if ((active && bpts.some(pt=>pointInRect(pt.x,pt.y,box))) ||
          (p.diving && overlap(p,box)) ||
          (p.dashT>0 && overlap(p,box))){
        breakProp(pr);
      }
    }

    // Bolts
    const pcx = p.x+p.w/2, pcy = p.y+p.h/2;
    for (const b of bolts){
      b.x += b.vx; b.y += b.vy; b.life--;
      // renvoi par la lame — ou renvoi automatique en mode Fureur (rayon autour du héros)
      const deflect = b.from==='trooper' &&
        ((active && bpts.some(pt=>Math.hypot(pt.x-b.x, pt.y-b.y)<6)) ||
         (fury && Math.hypot(b.x-pcx, b.y-pcy) < 26));
      if (deflect){
        deflectBolt(b);
        spark(b.x,b.y, fury?'#bfeaff':'#bff7ff', 10);
        kick(2); state.hitstop = Math.max(state.hitstop, 2); Snd.deflect();
      }
      // touche le joueur
      if (b.from==='trooper' && p.invuln<=0 && p.rolling<=0 &&
          b.x>p.x && b.x<p.x+p.w && b.y>p.y && b.y<p.y+p.h){
        b.life=0; hurt(1);
      }
      // bolt renvoyé touche un ennemi (ou brise un pylône au passage)
      if (b.from==='player'){
        for (const t of troopers){
          if (t.alive && b.x>t.x && b.x<t.x+t.w && b.y>t.y && b.y<t.y+t.h){
            if (damageEnemy(t, 2)){ b.life=0; spark(t.x+6,t.y+10,'#8fe3ff',10); kick(3); Snd.hit(); }
          }
        }
        for (const pr of props){
          if (pr.alive && b.x>pr.x-1 && b.x<pr.x+pr.w+1 && b.y>pr.y && b.y<pr.y+pr.h) breakProp(pr);
        }
      }
      if (b.x<0||b.x>LEVEL_W || b.y<-8 || b.y>H+8) b.life=0;
    }
    bolts = bolts.filter(b=>b.life>0);

    // Bonus
    updatePickups();

    // Fureur
    if (p.fury>0) p.fury--;

    // Anneaux d'onde
    for (const r of rings) r.r += 3;
    rings = rings.filter(r => r.r < r.max);

    // Sparks
    for (const s of sparks){ s.x+=s.vx; s.y+=s.vy; s.vy+=0.08; s.life--; }
    sparks = sparks.filter(s=>s.life>0);

    // Caméra
    state.cam = Math.max(0, Math.min(LEVEL_W-W, p.x - W/2 + 6));

    // Chrono de la partie
    state.runTime++;

    // Bannière
    if (msgT>0) msgT--;

    if (state.arena){
      // Arène : vague suivante quand tout est nettoyé
      if (!troopers.some(t=>t.alive)){
        if (waveT<=0){
          waveT = 110;
          banner('VAGUE '+state.wave+' NETTOYÉE !');
          addPickup(LEVEL_W/2-5, GROUND-40, 'heal');
          Snd.pickup();
        } else if (--waveT===0){
          state.wave++;
          spawnWave(state.wave);
          banner('VAGUE '+state.wave);
        }
      }
    } else {
      // Fin de niveau — la porte reste verrouillée tant que le boss vit
      if (p.x+p.w >= GOAL_X){
        if (!bossAlive()){
          if (state.level < LEVELS.length){
            nextLevel();                       // passe au niveau suivant
          } else {
            finishRun('win');                  // dernier niveau terminé
          }
        } else if (msgT<=0){
          banner('VAINCS LE GARDE !');
        }
      }
    }
    if (p.hp<=0){ finishRun('dead'); }
  }

  // Calcule le rang, met en banque les cristaux et fige la fin de partie
  const RANKS = 'DCBAS';
  function finishRun(mode){
    if (state.arena){
      const w = state.wave;
      state.rank = w>=12 ? 'S' : w>=9 ? 'A' : w>=6 ? 'B' : w>=4 ? 'C' : 'D';
      save.bestWave = Math.max(save.bestWave||0, w);
    } else {
      const secs = state.runTime/60;
      let score = killCount*100 + player.hp*120;
      score += Math.max(0, 500 - secs*2);         // bonus de rapidité
      if (mode==='win') score += 600;
      state.rank = score>1800 ? 'S' : score>1400 ? 'A' : score>1000 ? 'B' : score>600 ? 'C' : 'D';
      if (RANKS.indexOf(state.rank) > RANKS.indexOf(save.bestRank)) save.bestRank = state.rank;
    }
    save.crystals += runCrystals;
    save.runs++;
    persist();
    state.mode = mode;
    if (mode==='win') Snd.win(); else Snd.lose();
  }

  // ---------- Menus ----------
  function zone(x,y,w,h,cb){ uiZones.push({x,y,w,h,cb}); }
  function handleTap(mx,my){
    if (state.mode==='play') return;
    Snd.resume();
    for (const z of uiZones){
      if (mx>=z.x && mx<=z.x+z.w && my>=z.y && my<=z.y+z.h){ z.cb(); return; }
    }
  }
  function menuKey(code){
    Snd.resume();
    if (state.mode==='title' || state.mode==='win' || state.mode==='dead'){
      if (code==='Enter'||code==='Space'||code==='KeyJ'){ gotoSelect(); }
      return;
    }
    if (state.mode==='select' || state.mode==='shop'){
      const n = uiZones.length; if (!n) return;
      if (code==='ArrowRight'||code==='ArrowDown'){ menu.sel=(menu.sel+1)%n; Snd.uiMove(); }
      else if (code==='ArrowLeft'||code==='ArrowUp'){ menu.sel=(menu.sel-1+n)%n; Snd.uiMove(); }
      else if (code==='Enter'||code==='Space'||code==='KeyJ'){ const z=uiZones[menu.sel]; if(z) z.cb(); }
      else if (code==='Escape'){
        state.mode = state.mode==='shop' ? 'select' : 'title';
        menu.sel = state.mode==='select' ? 5 : 0;
        Snd.uiMove();
      }
    }
  }
  function gotoSelect(){ state.mode='select'; menu.sel=5; Snd.uiSel(); }

  function tryBuyChar(id){
    const ch = CHARS[id];
    if (save.chars[id]){ menu.char=id; Snd.uiSel(); return; }
    if (save.crystals >= ch.cost){
      save.crystals -= ch.cost; save.chars[id]=true; persist();
      menu.char = id; Snd.buy();
    } else Snd.err();
  }
  function tryBuyUpgrade(row){
    const lvl = save[row.k];
    if (lvl>=3){ Snd.err(); return; }
    const cost = row.costs[lvl];
    if (save.crystals >= cost){
      save.crystals -= cost; save[row.k]++; persist(); Snd.buy();
    } else Snd.err();
  }

  // ---------- Rendu ----------
  function px(x){ return Math.round(x - state.cam); }

  function drawBg(){
    const th = theme || LEVELS[0].theme;
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, th.sky0); g.addColorStop(1, th.sky1);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle=th.star;
    for(const s of starL){
      const x=(s.x - state.cam*0.2)%W; const xx=x<0?x+W:x;
      ctx.fillRect(xx|0, s.y|0, s.s, s.s);
    }
    const pxp = px(1180);
    ctx.fillStyle=th.planet; ctx.beginPath();
    ctx.arc(pxp, 44, 30, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle=th.planet2; ctx.beginPath();
    ctx.arc(pxp-8, 38, 22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle=th.starNear;
    for(const s of starF){
      const x=px(s.x); if(x>-2&&x<W+2) ctx.fillRect(x, s.y|0, s.s, s.s);
    }
  }

  function drawPlatforms(){
    const th = theme || LEVELS[0].theme;
    for(const pl of platforms){
      const x=px(pl.x);
      if (x>W || x+pl.w<0) continue;
      if (pl.h>=24){ // sol
        ctx.fillStyle=th.ground; ctx.fillRect(x, pl.y, pl.w, pl.h);
        ctx.fillStyle=th.groundTop; ctx.fillRect(x, pl.y, pl.w, 3);
        ctx.fillStyle=th.groundLine;
        for(let i=0;i<pl.w;i+=16) ctx.fillRect(x+i, pl.y+6, 1, pl.h-6);
      } else { // plateforme flottante
        ctx.fillStyle=th.plat; ctx.fillRect(x, pl.y, pl.w, pl.h);
        ctx.fillStyle=th.platTop; ctx.fillRect(x, pl.y, pl.w, 2);
        ctx.fillStyle=th.platBot; ctx.fillRect(x, pl.y+pl.h-1, pl.w, 1);
      }
    }
    // porte de sortie (pas de sortie en arène)
    if (state.arena) return;
    const gx=px(GOAL_X);
    if (gx<W+40){
      const locked = bossAlive();
      ctx.fillStyle='#1a2338'; ctx.fillRect(gx, GROUND-40, 26, 40);
      const glow = 0.5+0.5*Math.sin(state.time*0.1);
      ctx.fillStyle = locked ? '#e0483c' : '#5ce0ff';
      ctx.globalAlpha = locked ? 0.35 : 0.5+glow*0.5;
      ctx.fillRect(gx+4, GROUND-36, 18, 34);
      ctx.globalAlpha=1;
      ctx.fillStyle='#0a0f1e'; ctx.fillRect(gx+10, GROUND-20, 6, 6);
      if (locked){
        ctx.fillStyle='#e0483c';
        ctx.fillRect(gx+10, GROUND-24, 6, 5); ctx.fillRect(gx+11, GROUND-27, 4, 3);
      }
    }
  }

  function drawProps(){
    const th = theme || LEVELS[0].theme;
    for (const pr of props){
      const x = px(pr.x);
      if (x<-10||x>W+10) continue;
      ctx.fillStyle='#1a2130';
      ctx.fillRect(x+2, pr.y+4, 2, pr.h-4);          // mât
      ctx.fillRect(x, pr.y+pr.h-2, 6, 2);            // socle
      if (pr.alive){
        pr.ph += 0.15;
        const gl = 0.6+0.3*Math.sin(pr.ph);
        ctx.globalAlpha = 0.35*gl; ctx.fillStyle = th.starNear;
        ctx.beginPath(); ctx.arc(x+3, pr.y+2, 5, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle='#ffe8a0'; ctx.fillRect(x+1, pr.y, 4, 4);
      }
    }
  }

  function drawTrooper(t){
    const x=px(t.x), y=t.y;
    if (x<-16||x>W+16) return;
    const flash = t.hit>0 && (t.hit%4<2);
    ctx.fillStyle = flash ? '#ffb0b0' : '#e6ecf5';
    ctx.fillRect(x+2, y+8, 8, 10);        // torse
    ctx.fillRect(x+2, y, 8, 8);           // casque
    ctx.fillStyle='#0d1220';
    ctx.fillRect(x+3, y+2, 6, 3);         // visière
    ctx.fillRect(x+4, y+18, 2, 4);        // jambe
    ctx.fillRect(x+8, y+18, 2, 4);
    ctx.fillStyle='#2a2f3a';
    const muzzle = t.dir>0 ? x+15 : x-3;
    if (t.dir>0) ctx.fillRect(x+10, y+11, 5, 2);
    else ctx.fillRect(x-3, y+11, 5, 2);
    // télégraphe de tir : lueur rouge qui grossit au canon pendant la visée
    if (t.aim>0){
      const c = 1 - t.aim/AIM_TIME;
      const r = 1.5 + c*3;
      ctx.globalAlpha = 0.35 + 0.55*c;
      ctx.fillStyle = '#ff5a4d';
      ctx.beginPath(); ctx.arc(muzzle, y+12, r, 0, Math.PI*2); ctx.fill();
      if (c>0.7){ ctx.fillStyle='#ffd0c0'; ctx.beginPath(); ctx.arc(muzzle, y+12, r*0.5, 0, Math.PI*2); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
  }

  function drawDroid(t){
    const x=px(t.x), y=t.y;
    if (x<-18||x>W+18) return;
    const flash = t.hit>0 && (t.hit%4<2);
    ctx.globalAlpha=0.4; ctx.fillStyle='#3aa0ff';
    ctx.beginPath(); ctx.arc(x+t.w/2, y+t.h/2, 9, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle = flash ? '#ffb0b0' : '#9aa8bd';
    ctx.fillRect(x+2, y+2, 10, 6);
    ctx.fillStyle='#6b7688'; ctx.fillRect(x, y+4, 14, 3);
    ctx.fillStyle='#ff4d4d'; ctx.fillRect(x+ (t.dir>0?9:3), y+3, 3, 3);
    const mx=x+t.w/2, my=y+t.h;
    ctx.fillStyle='#2a2f3a'; ctx.fillRect(mx-1, my-1, 2, 3);
    if (t.aim>0){
      const c=1-t.aim/AIM_TIME, r=1.5+c*3;
      ctx.globalAlpha=0.35+0.55*c; ctx.fillStyle='#ff5a4d';
      ctx.beginPath(); ctx.arc(mx, my+1, r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }
  }

  function drawAcolyte(t){
    const x=px(t.x), y=t.y;
    if (x<-18||x>W+18) return;
    const flash = t.hit>0 && (t.hit%4<2);
    // robe sombre à capuche
    ctx.fillStyle = flash ? '#7a4a5a' : '#2a2233';
    ctx.fillRect(x+1, y+5, 9, 15);
    ctx.fillStyle = flash ? '#8a5a6a' : '#1a1420';
    ctx.fillRect(x+2, y, 7, 7);            // capuche
    ctx.fillStyle='#ff4040';
    ctx.fillRect(x+3, y+3, 2, 2); ctx.fillRect(x+6, y+3, 2, 2);   // yeux rouges
    ctx.fillStyle='#14101c';
    ctx.fillRect(x+3, y+18, 2, 2); ctx.fillRect(x+6, y+18, 2, 2);
    // lame courte rouge, angle selon l'état
    const gx = t.dir>0 ? x+10 : x+1, gy = y+10;
    let a = -0.6;
    if (t.st==='wind') a = -2.0;
    else if (t.st==='lunge') a = 0.15;
    const len = 12, d=t.dir;
    const ex = gx + Math.cos(a)*len*d, ey = gy + Math.sin(a)*len;
    ctx.lineCap='round';
    if (t.st==='wind'){   // télégraphe : lame qui pulse
      ctx.globalAlpha = 0.5+0.4*Math.sin(state.time*0.6);
    }
    ctx.strokeStyle='rgba(255,60,60,0.4)'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.strokeStyle='#ff3b3b'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.globalAlpha=1; ctx.lineWidth=1;
  }

  function drawBoss(t){
    const x=px(t.x), y=t.y;
    if (x<-40||x>W+40) return;
    const flash = t.hit>0 && (t.hit%4<2);
    if (t.state==='tpout') ctx.globalAlpha = Math.max(0.15, t.stateT/16);
    else if (t.state==='tpin') ctx.globalAlpha = 1 - t.stateT/16;
    if (t.enraged){   // aura sombre de phase 2
      const ga = ctx.globalAlpha;
      ctx.globalAlpha = ga * (0.2 + 0.12*Math.sin(state.time*0.35));
      ctx.strokeStyle='#c77dff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(x+t.w/2, y+t.h/2, 17, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = ga; ctx.lineWidth=1;
    }
    ctx.fillStyle = flash ? '#7a3b3b' : '#241a2e';
    ctx.fillRect(x, y+8, t.w, t.h-8);
    ctx.fillStyle = flash ? '#8a4a4a' : '#151019';
    ctx.fillRect(x+3, y+8, t.w-6, t.h-10);
    ctx.fillStyle='#0d0a12'; ctx.fillRect(x+4, y, t.w-8, 9);
    ctx.fillStyle='#c0202a'; ctx.fillRect(x+6, y+3, t.w-12, 2);
    ctx.fillStyle='#0d0a12';
    ctx.fillRect(x+4, y+t.h-4, 3, 4); ctx.fillRect(x+t.w-7, y+t.h-4, 3, 4);
    // Sabre rouge : position selon l'état
    const gx = t.dir>0 ? x+t.w : x;
    const gy = y+12;
    let a;
    if (t.state==='guard')                          a = -1.15;
    else if (t.state==='wind'||t.state==='volwind') a = -2.2;
    else if (t.state==='attack')                    a = 0.5;
    else if (t.state==='burst')                     a = 0;
    else                                             a = -0.7;
    const len = t.state==='burst' ? 26 : 20, d=t.dir;
    const ex = gx + Math.cos(a)*len*d, ey = gy + Math.sin(a)*len;
    ctx.fillStyle='#c9ccd4'; ctx.fillRect(gx-1, gy-1, 3, 4);
    ctx.lineCap='round';
    ctx.strokeStyle='rgba(255,60,60,0.35)'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.strokeStyle='#ff3b3b'; ctx.lineWidth=3.2; ctx.globalAlpha=0.8;
    ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.globalAlpha=1;
    ctx.strokeStyle='#ffd9d9'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.lineWidth=1;
    // télégraphe de volée : charge rouge au poing
    if (t.state==='volwind'){
      const c = 1 - t.stateT/24, r = 2+c*4;
      ctx.globalAlpha=0.4+0.5*c; ctx.fillStyle='#ff5a4d';
      ctx.beginPath(); ctx.arc(gx, gy, r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }
    // bouclier de garde
    if (t.state==='guard'){
      ctx.globalAlpha=0.25+0.15*Math.sin(state.time*0.3);
      ctx.strokeStyle='#ffd24d'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(x+t.w/2, y+t.h/2, 15, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha=1; ctx.lineWidth=1;
    }
    // barre de vie du boss
    const bw=t.w+8, bx=x-4, by=y-7;
    ctx.fillStyle='#3a1420'; ctx.fillRect(bx, by, bw, 3);
    ctx.fillStyle = t.enraged ? '#c77dff' : '#ff4d6a';
    ctx.fillRect(bx, by, bw*Math.max(0,t.hp)/t.maxhp, 3);
    ctx.globalAlpha = 1;
  }

  function drawEnemy(t){
    if (t.type==='droid') drawDroid(t);
    else if (t.type==='boss') drawBoss(t);
    else if (t.type==='acolyte') drawAcolyte(t);
    else drawTrooper(t);
    // étoiles d'étourdissement
    if (t.alive && t.stun>0){
      const x=px(t.x)+t.w/2, y=t.y-5;
      ctx.fillStyle='#ffe873';
      const ph = state.time*0.3;
      ctx.fillRect(x-5+Math.cos(ph)*4|0, y+Math.sin(ph)*2|0, 2, 2);
      ctx.fillRect(x+3+Math.cos(ph+3)*4|0, y+Math.sin(ph+3)*2|0, 2, 2);
    }
  }

  function drawPickups(){
    for (const k of pickups){
      const x=px(k.x), y=k.y + Math.sin(k.phase)*2;
      if (x<-12||x>W+12) continue;
      if (k.type==='shard'){
        ctx.save();
        ctx.translate(x+3, y+3); ctx.rotate(Math.PI/4);
        ctx.fillStyle='#ffd24d'; ctx.fillRect(-2.5,-2.5,5,5);
        ctx.fillStyle='#fff3c0'; ctx.fillRect(-1,-1,2,2);
        ctx.restore();
        continue;
      }
      const heal = k.type==='heal';
      const col = heal ? '#7dff9a' : '#5cc8ff';
      ctx.globalAlpha=0.35+0.2*Math.sin(k.phase*2);
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(x+k.w/2, y+k.h/2, 8, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
      ctx.save();
      ctx.translate(x+k.w/2, y+k.h/2); ctx.rotate(Math.PI/4);
      ctx.fillStyle=col; ctx.fillRect(-4,-4,8,8);
      ctx.fillStyle='#ffffff'; ctx.fillRect(-2,-2,3,3);
      ctx.restore();
      ctx.fillStyle='#06210f';
      if (heal){ ctx.fillRect(x+4, y+2, 2, 6); ctx.fillRect(x+2, y+4, 6, 2); }
    }
  }

  function drawThrown(){
    if (!thrown) return;
    const x = px(thrown.x), y = thrown.y;
    const c = player.col;
    ctx.globalAlpha=0.35; ctx.fillStyle=c.core;
    ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(thrown.spin);
    ctx.lineCap='round';
    ctx.strokeStyle=c.core; ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(-7,0); ctx.lineTo(7,0); ctx.stroke();
    ctx.strokeStyle=c.hot; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(-7,0); ctx.lineTo(7,0); ctx.stroke();
    ctx.restore();
    ctx.lineWidth=1;
  }

  function drawRings(){
    for (const r of rings){
      ctx.globalAlpha = Math.max(0, 1 - r.r/r.max) * 0.6;
      ctx.strokeStyle = r.col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px(r.x), r.y, r.r, 0, Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha=1; ctx.lineWidth=1;
  }

  function drawPlayer(){
    const p=player, x=px(p.x), y=p.y;
    if (p.rolling>0){
      const cx = x+p.w/2, cy = y+p.h/2;
      const ang = (1 - p.rolling/ROLL_DUR) * Math.PI*2 * p.face;
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(ang);
      ctx.fillStyle=p.body.robe; ctx.fillRect(-5,-5,10,10);
      ctx.fillStyle=p.body.torso; ctx.fillRect(-4,-4,8,5);
      ctx.fillStyle='#e8c9a0'; ctx.fillRect(-2,-4,5,4);
      ctx.restore();
      return;
    }
    const fury = p.fury>0;
    if (fury){
      ctx.globalAlpha = 0.18 + 0.1*Math.sin(state.time*0.4);
      ctx.fillStyle = '#5cc8ff';
      ctx.beginPath(); ctx.arc(x+p.w/2, y+p.h/2, 14, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (p.invuln>0 && p.invuln%6<3){ /* clignote */ } else {
      ctx.fillStyle=p.body.robe; ctx.fillRect(x+1, y+6, 10, 12);
      ctx.fillStyle=p.body.torso; ctx.fillRect(x+2, y+6, 8, 6);
      ctx.fillStyle='#e8c9a0'; ctx.fillRect(x+3, y, 6, 7);
      ctx.fillStyle=p.body.hair; ctx.fillRect(x+3, y, 6, 2);
      ctx.fillStyle=p.body.legs;
      ctx.fillRect(x+4, y+16, 2, 6); ctx.fillRect(x+7, y+16, 2, 6);
    }
    const cTrail = p.col.trail, cGlow = p.col.glow;
    const cCore = p.col.core, cHot = p.col.hot;
    ctx.lineCap='round';
    if (p.saberOn){
      for (const tr of saberTrail){
        const a = tr.life/9, w = tr.tw || 1;
        ctx.strokeStyle = 'rgba('+cTrail+','+(a*0.45).toFixed(3)+')';
        ctx.lineWidth = (1.5 + a*2.5) * w;
        ctx.beginPath();
        ctx.moveTo(px(tr.gx), tr.gy); ctx.lineTo(px(tr.tx), tr.ty);
        ctx.stroke();
      }
    }
    const seg = saberSeg();
    const bx = px(seg.gx), by = seg.gy, ex = px(seg.tx), ey = seg.ty;
    const w = (p.attack>0 && !p.diving && COMBO[p.combo]) ? COMBO[p.combo].tw : 1;
    ctx.fillStyle='#c9ccd4';
    ctx.fillRect(bx-1, by-2, 3, 5);
    if (p.saberOn && !thrown){
      ctx.strokeStyle='rgba('+cGlow+','+(0.3+0.12*(w-1)).toFixed(3)+')'; ctx.lineWidth=6*w;
      ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.strokeStyle=cCore; ctx.lineWidth=3.4*w; ctx.globalAlpha=0.75;
      ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.globalAlpha=1;
      ctx.strokeStyle=cHot; ctx.lineWidth=1.6*Math.min(w,1.3);
      ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.lineWidth=1;
    }
  }

  function drawBolts(){
    for(const b of bolts){
      const x=px(b.x);
      if (x<-4||x>W+4) continue;
      const col = b.from==='player' ? '#7dff9a' : '#ff4d4d';
      ctx.strokeStyle=col; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(x, b.y); ctx.lineTo(x - Math.sign(b.vx)*4, b.y - b.vy*1.5);
      ctx.stroke();
      ctx.fillStyle='#fff'; ctx.fillRect(x-1, b.y-1, 2, 2);
      ctx.lineWidth=1;
    }
  }

  function drawSparks(){
    for(const s of sparks){
      ctx.globalAlpha = Math.max(0, s.life/16);
      ctx.fillStyle=s.color; ctx.fillRect(s.x|0, s.y|0, 2, 2);
    }
    ctx.globalAlpha=1;
  }

  function drawHud(){
    const p = player;
    // coeurs
    for(let i=0;i<p.maxhp;i++){
      ctx.fillStyle = i<p.hp ? '#ff5b7a' : '#3a2030';
      const hx=6+i*12, hy=6;
      ctx.fillRect(hx+1,hy,3,3); ctx.fillRect(hx+5,hy,3,3);
      ctx.fillRect(hx,hy+2,9,3); ctx.fillRect(hx+2,hy+5,5,2); ctx.fillRect(hx+3,hy+7,3,1);
    }
    // jauge d'énergie de Force (encoche = coût du pouvoir)
    const ew=54, ex=6, ey=17;
    ctx.fillStyle='#101d33'; ctx.fillRect(ex, ey, ew, 4);
    ctx.fillStyle='#5ca8ff'; ctx.fillRect(ex, ey, ew*p.energy/p.energyMax, 4);
    const notch = ew*p.charDef.power.cost/p.energyMax;
    ctx.fillStyle='#cfe3ff'; ctx.fillRect(ex+notch|0, ey-1, 1, 6);
    // jauge de Fureur
    if (p.fury>0){
      ctx.fillStyle='#123049'; ctx.fillRect(ex, ey+7, ew, 3);
      ctx.fillStyle='#5cc8ff'; ctx.fillRect(ex, ey+7, ew*p.fury/FURY_TIME, 3);
    }
    // vaincus + progression (ou vague) + cristaux
    ctx.fillStyle='#8fe3ff'; ctx.font='8px "Courier New"'; ctx.textAlign='right';
    ctx.fillText('VAINCUS '+killCount, W-6, 12);
    if (state.arena){
      ctx.fillStyle='#ff9d5c'; ctx.font='bold 8px "Courier New"';
      ctx.fillText('VAGUE '+state.wave, W-6, 21);
      ctx.font='8px "Courier New"';
    } else {
      const prog = Math.min(1, p.x/GOAL_X);
      ctx.fillStyle='#1b2740'; ctx.fillRect(W-70, 16, 62, 3);
      ctx.fillStyle='#5ce0ff'; ctx.fillRect(W-70, 16, 62*prog, 3);
    }
    ctx.fillStyle='#ffd24d';
    ctx.fillText('◆ '+runCrystals, W-6, 30);

    // indicateur de combo au-dessus du héros
    if (p.comboShow>0 && p.combo>0){
      ctx.globalAlpha = Math.min(1, p.comboShow/12);
      ctx.fillStyle = p.combo>=COMBO.length-1 ? '#ffd24d' : '#8fe3ff';
      ctx.font='bold 9px "Courier New"'; ctx.textAlign='center';
      ctx.fillText('COMBO ×'+(p.combo+1), px(p.x)+p.w/2, p.y-6);
      ctx.globalAlpha=1;
    }

    if (msgT>0){
      ctx.globalAlpha=Math.min(1,msgT/30);
      ctx.fillStyle='#ffe873'; ctx.font='bold 10px "Courier New"';
      ctx.textAlign='center';
      ctx.fillText(msg, W/2, 40);
      ctx.globalAlpha=1;
    }
    ctx.textAlign='left';
  }

  // Mini-figurine d'un personnage (cartes de sélection)
  function drawMini(x, y, ch){
    ctx.fillStyle=ch.body.robe; ctx.fillRect(x+1, y+6, 10, 12);
    ctx.fillStyle=ch.body.torso; ctx.fillRect(x+2, y+6, 8, 6);
    ctx.fillStyle='#e8c9a0'; ctx.fillRect(x+3, y, 6, 7);
    ctx.fillStyle=ch.body.hair; ctx.fillRect(x+3, y, 6, 2);
    ctx.fillStyle=ch.body.legs;
    ctx.fillRect(x+4, y+16, 2, 6); ctx.fillRect(x+7, y+16, 2, 6);
    ctx.lineCap='round';
    ctx.strokeStyle='rgba('+ch.col.glow+',0.4)'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(x+13, y+10); ctx.lineTo(x+20, y-5); ctx.stroke();
    ctx.strokeStyle=ch.col.core; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x+13, y+10); ctx.lineTo(x+20, y-5); ctx.stroke();
    ctx.lineWidth=1;
  }

  function blink(){ return Math.floor(state.time/25)%2===0; }

  function drawTitle(){
    uiZones.length = 0;
    drawBg();
    ctx.fillStyle='rgba(3,5,12,0.65)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#4dff8a'; ctx.font='bold 20px "Courier New"';
    ctx.fillText('SABRE & ÉTOILES', W/2, 58);
    ctx.fillStyle='#8fa4cc'; ctx.font='9px "Courier New"';
    ctx.fillText('Un Castlevania-like au sabre laser', W/2, 74);
    if (blink()){
      ctx.fillStyle='#cfe3ff'; ctx.font='bold 10px "Courier New"';
      ctx.fillText('TOUCHE L\'ÉCRAN  ·  ESPACE', W/2, 108);
    }
    ctx.fillStyle='#ffd24d'; ctx.font='9px "Courier New"';
    ctx.fillText('◆ '+save.crystals, W/2 - (save.bestRank?34:0), 132);
    if (save.bestRank){
      ctx.fillStyle='#8fe3ff';
      ctx.fillText('MEILLEUR RANG : '+save.bestRank, W/2+38, 132);
    }
    if (save.bestWave>0){
      ctx.fillStyle='#ff9d5c';
      ctx.fillText('ARÈNE — RECORD : VAGUE '+save.bestWave, W/2, 144);
    }
    ctx.fillStyle='#546a94'; ctx.font='7px "Courier New"';
    ctx.fillText('3 héros · pouvoirs de Force · améliorations permanentes', W/2, 158);
    ctx.textAlign='left';
    zone(0, 0, W, H, gotoSelect);
  }

  function drawSelect(){
    uiZones.length = 0;
    drawBg();
    ctx.fillStyle='rgba(3,5,12,0.78)'; ctx.fillRect(0,0,W,H);
    ctx.font='bold 9px "Courier New"'; ctx.textAlign='left';
    ctx.fillStyle='#cfe3ff'; ctx.fillText('CHOISIS TON HÉROS', 8, 14);
    ctx.textAlign='right'; ctx.fillStyle='#ffd24d';
    ctx.fillText('◆ '+save.crystals, W-8, 14);

    CHAR_IDS.forEach((id, i) => {
      const ch = CHARS[id];
      const cx = 8+i*104, cy = 20, cw = 96, chh = 102;
      zone(cx, cy, cw, chh, () => tryBuyChar(id));
      ctx.fillStyle='rgba(13,21,38,0.92)';
      ctx.fillRect(cx, cy, cw, chh);
      ctx.strokeStyle = menu.char===id ? ch.col.core : '#26324e';
      ctx.lineWidth = menu.char===id ? 2 : 1;
      ctx.strokeRect(cx+0.5, cy+0.5, cw-1, chh-1);
      ctx.lineWidth=1;
      ctx.textAlign='center';
      ctx.fillStyle=ch.col.core; ctx.font='bold 10px "Courier New"';
      ctx.fillText(ch.name, cx+cw/2, cy+13);
      ctx.fillStyle='#8fa4cc'; ctx.font='7px "Courier New"';
      ctx.fillText(ch.cls, cx+cw/2, cy+23);
      drawMini(cx+cw/2-10, cy+30, ch);
      ctx.fillStyle='#cfe3ff'; ctx.font='7px "Courier New"';
      ctx.fillText('VIE '+ch.hp+'  ·  VIT '+(ch.spd>1?'++':ch.spd<1?'−':'='), cx+cw/2, cy+64);
      ctx.fillStyle=ch.col.core;
      ctx.fillText(ch.power.name, cx+cw/2, cy+76);
      ctx.fillStyle='#7f92b5'; ctx.font='6px "Courier New"';
      ctx.fillText(ch.power.desc, cx+cw/2, cy+85);
      ctx.fillText(ch.power.cost+' énergie', cx+cw/2, cy+94);
      if (!save.chars[id]){
        ctx.fillStyle='rgba(0,0,0,0.68)'; ctx.fillRect(cx, cy, cw, chh);
        ctx.fillStyle='#ffd24d'; ctx.font='bold 9px "Courier New"';
        ctx.fillText('◆ '+ch.cost, cx+cw/2, cy+50);
        ctx.fillStyle = save.crystals>=ch.cost ? '#7dff9a' : '#8fa4cc';
        ctx.font='7px "Courier New"';
        ctx.fillText(save.crystals>=ch.cost ? (blink()?'TOUCHER POUR RECRUTER':'') : 'VERROUILLÉ', cx+cw/2, cy+62);
      }
    });

    // boutons bas : atelier / arène / mission
    const by = 130, bh = 20;
    zone(8, by, 96, bh, () => { state.mode='shop'; menu.sel=0; Snd.uiSel(); });
    ctx.fillStyle='rgba(20,32,56,0.95)'; ctx.fillRect(8, by, 96, bh);
    ctx.strokeStyle='#3a4d78'; ctx.strokeRect(8.5, by+0.5, 95, bh-1);
    ctx.fillStyle='#ffd24d'; ctx.font='bold 8px "Courier New"'; ctx.textAlign='center';
    ctx.fillText('ATELIER ◆', 8+48, by+13);

    zone(112, by, 96, bh, () => startArena(menu.char));
    ctx.fillStyle='rgba(50,32,20,0.95)'; ctx.fillRect(112, by, 96, bh);
    ctx.strokeStyle='#7a583a'; ctx.strokeRect(112.5, by+0.5, 95, bh-1);
    ctx.fillStyle='#ff9d5c';
    ctx.fillText('ARÈNE ∞', 112+48, by+13);

    zone(216, by, 96, bh, () => startRun(menu.char));
    ctx.fillStyle='rgba(20,50,36,0.95)'; ctx.fillRect(216, by, 96, bh);
    ctx.strokeStyle='#3a7a58'; ctx.strokeRect(216.5, by+0.5, 95, bh-1);
    ctx.fillStyle='#7dff9a';
    ctx.fillText('MISSION ▶', 216+48, by+13);

    ctx.fillStyle='#546a94'; ctx.font='7px "Courier New"';
    ctx.fillText('← → naviguer · ENTRÉE valider · ÉCHAP retour', W/2, 168);
    ctx.textAlign='left';

    // surbrillance clavier
    if (menu.sel>=uiZones.length) menu.sel=uiZones.length-1;
    const z = uiZones[menu.sel];
    if (z){
      ctx.strokeStyle='#8fe3ff'; ctx.lineWidth=1;
      ctx.setLineDash([3,2]);
      ctx.strokeRect(z.x-2.5, z.y-2.5, z.w+5, z.h+5);
      ctx.setLineDash([]);
    }
  }

  function drawShop(){
    uiZones.length = 0;
    drawBg();
    ctx.fillStyle='rgba(3,5,12,0.82)'; ctx.fillRect(0,0,W,H);
    ctx.font='bold 9px "Courier New"'; ctx.textAlign='left';
    ctx.fillStyle='#ffd24d'; ctx.fillText('ATELIER — AMÉLIORATIONS PERMANENTES', 8, 14);
    ctx.textAlign='right';
    ctx.fillText('◆ '+save.crystals, W-8, 14);

    SHOP.forEach((row, i) => {
      const ry = 24+i*34, rh = 30;
      zone(14, ry, W-28, rh, () => tryBuyUpgrade(row));
      const lvl = save[row.k];
      ctx.fillStyle='rgba(13,21,38,0.92)'; ctx.fillRect(14, ry, W-28, rh);
      ctx.strokeStyle='#26324e'; ctx.strokeRect(14.5, ry+0.5, W-29, rh-1);
      ctx.textAlign='left';
      ctx.fillStyle='#cfe3ff'; ctx.font='bold 8px "Courier New"';
      ctx.fillText(row.name, 20, ry+12);
      // pastilles de niveau
      for (let n=0;n<3;n++){
        ctx.fillStyle = n<lvl ? '#7dff9a' : '#26324e';
        ctx.beginPath(); ctx.arc(110+n*10, ry+9, 3, 0, Math.PI*2); ctx.fill();
      }
      ctx.fillStyle='#7f92b5'; ctx.font='7px "Courier New"';
      ctx.fillText(lvl<3 ? ('Prochain : '+row.desc[lvl]) : 'Niveau maximum atteint', 20, ry+23);
      ctx.textAlign='right';
      if (lvl<3){
        const cost = row.costs[lvl];
        ctx.fillStyle = save.crystals>=cost ? '#ffd24d' : '#6a5a30';
        ctx.font='bold 9px "Courier New"';
        ctx.fillText('◆ '+cost, W-20, ry+18);
      } else {
        ctx.fillStyle='#7dff9a'; ctx.font='bold 9px "Courier New"';
        ctx.fillText('MAX', W-20, ry+18);
      }
    });

    const by = 132, bh = 20;
    zone(W/2-58, by, 116, bh, () => { state.mode='select'; menu.sel=5; Snd.uiMove(); });
    ctx.fillStyle='rgba(20,32,56,0.95)'; ctx.fillRect(W/2-58, by, 116, bh);
    ctx.strokeStyle='#3a4d78'; ctx.strokeRect(W/2-57.5, by+0.5, 115, bh-1);
    ctx.fillStyle='#cfe3ff'; ctx.font='bold 8px "Courier New"'; ctx.textAlign='center';
    ctx.fillText('RETOUR', W/2, by+13);

    ctx.fillStyle='#546a94'; ctx.font='7px "Courier New"';
    ctx.fillText('Les cristaux ◆ récoltés en mission restent acquis', W/2, 166);
    ctx.textAlign='left';

    if (menu.sel>=uiZones.length) menu.sel=uiZones.length-1;
    const z = uiZones[menu.sel];
    if (z){
      ctx.strokeStyle='#8fe3ff'; ctx.setLineDash([3,2]);
      ctx.strokeRect(z.x-2.5, z.y-2.5, z.w+5, z.h+5);
      ctx.setLineDash([]);
    }
  }

  function fmtTime(frames){
    const s = Math.floor(frames/60), m = Math.floor(s/60);
    return (m>0 ? m+'m ' : '') + (s%60) + 's';
  }
  function drawEndScreen(win){
    uiZones.length = 0;
    drawBg();
    ctx.fillStyle='rgba(3,5,12,0.84)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle = win ? '#4dff8a' : '#ff6b6b';
    ctx.font='bold 15px "Courier New"';
    ctx.fillText(win ? 'MISSION ACCOMPLIE' : 'TOMBÉ AU COMBAT', W/2, 26);
    const rankCol = {S:'#ffd24d',A:'#8fe3ff',B:'#7dff9a',C:'#cfe3ff',D:'#8fa4cc'}[state.rank] || '#fff';
    ctx.fillStyle=rankCol; ctx.font='bold 34px "Courier New"';
    ctx.fillText(state.rank, W/2, 66);
    ctx.fillStyle='#7f92b5'; ctx.font='7px "Courier New"';
    ctx.fillText('RANG', W/2, 77);
    ctx.font='9px "Courier New"';
    const rows = [
      ['Héros', CHARS[menu.char].name],
      state.arena ? ['Vague atteinte', ''+state.wave]
                  : ['Niveau atteint', state.level + ' / ' + LEVELS.length],
      ['Ennemis vaincus', ''+killCount],
      ['Temps', fmtTime(state.runTime)],
      ['Cristaux récoltés', '+'+runCrystals+' ◆']
    ];
    let yy = 96;
    rows.forEach(r => {
      ctx.textAlign='left';  ctx.fillStyle='#8fa4cc'; ctx.fillText(r[0], W/2-78, yy);
      ctx.textAlign='right'; ctx.fillStyle = r[0].startsWith('Cristaux') ? '#ffd24d' : '#e8f0ff';
      ctx.fillText(r[1], W/2+78, yy);
      yy += 12;
    });
    ctx.textAlign='center';
    ctx.fillStyle='#ffd24d'; ctx.font='bold 9px "Courier New"';
    ctx.fillText('TOTAL : ◆ '+save.crystals, W/2, yy+6);
    if (blink()){
      ctx.fillStyle='#9fb0d0'; ctx.font='8px "Courier New"';
      ctx.fillText('Toucher / ENTRÉE : dépenser tes cristaux', W/2, H-10);
    }
    ctx.textAlign='left';
    zone(0, 0, W, H, gotoSelect);
  }

  // ---------- Boucle principale ----------
  function loop(){
    state.time++;
    Snd.tick();                       // musique de fond
    if (state.mode==='play'){
      if (state.hitstop>0) state.hitstop--; else update();
      drawBg();                        // fond plein écran (non secoué)
      ctx.save();
      if (state.shake>0.3){
        ctx.translate((Math.random()-0.5)*state.shake, (Math.random()-0.5)*state.shake);
      }
      drawPlatforms();
      drawProps();
      drawPickups();
      troopers.forEach(drawEnemy);
      drawBolts(); drawThrown(); drawRings(); drawPlayer(); drawSparks();
      ctx.restore();
      state.shake *= 0.82;
      drawHud();
    } else if (state.mode==='title'){
      drawTitle();
    } else if (state.mode==='select'){
      drawSelect();
    } else if (state.mode==='shop'){
      drawShop();
    } else if (state.mode==='win'){
      drawEndScreen(true);
    } else if (state.mode==='dead'){
      drawEndScreen(false);
    }
    requestAnimationFrame(loop);
  }

  loadLevel(LEVELS[0], false);   // décor pour l'écran titre
  loop();
})();
</script>
</body>
</html>
